<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - PocketSmart AI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🚀 Create Your Account</h1>

        <p>
            Join PocketSmart AI and start planning smarter.
        </p>

    </div>


    <div class="card">

        <h2>📝 Register</h2>

        <form method="post" action="/register">

            <label>👤 Name:</label>

            <br>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <br><br>


            <label>📧 Email:</label>

            <br>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>


            <label>🔐 Password:</label>

            <br>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <br><br>


            <button type="submit">
                ✨ Create Account
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="/login">Login here</a>
        </p>

    </div>


    <div class="card">

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
