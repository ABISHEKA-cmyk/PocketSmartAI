<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Recommendations - PocketSmart AI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🏠 PocketSmart AI</h1>

        <p>
            Your Smart Home Interior Recommendations
        </p>

    </div>


    <div class="card">

        <h2>✨ Your Plan</h2>

        <p>💰 <strong>Budget:</strong> ₹{{ budget }}</p>

        <p>🛋️ <strong>Room:</strong> {{ room }}</p>

        <p>📦 <strong>Number of Items:</strong> {{ items }}</p>

        <p>🎨 <strong>Style:</strong> {{ style }}</p>

    </div>


    <div class="card">

        <h2>🤖 AI Recommendations</h2>

        <div class="result">
            {{ recommendations }}
        </div>

    </div>


    <div class="card">

        <a href="/home-planner">
            ← Plan Again
        </a>

        <br><br>

        <a href="/">
            🏠 Back to Home
        </a>

    </div>

</div>

</body>

</html>
