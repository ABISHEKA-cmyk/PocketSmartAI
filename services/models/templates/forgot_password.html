<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 Forgot Password?</h1>

        <p>
            Reset your PocketSmart AI password easily.
        </p>

    </div>


    <div class="card">

        <h2>🔑 Reset Password</h2>

        {% if error %}

        <p style="color: red;">
            ⚠️ {{ error }}
        </p>

        {% endif %}


        <form method="post" action="/forgot-password">

            <label>📧 Registered Email:</label>

            <br>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <br><br>


            <label>🔐 New Password:</label>

            <br>

            <input
                type="password"
                name="new_password"
                placeholder="Enter your new password"
                required
            >

            <br><br>


            <button type="submit">
                🔄 Reset Password
            </button>

        </form>

        <br>

        <p>
            Remember your password?
            <a href="/login">Login here</a>
        </p>

    </div>


    <div class="card">

        <a href="/">
            🏠 Back to Home
        </a>

    </div>

</div>

</body>

</html>
