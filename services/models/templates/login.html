<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PocketSmart AI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 Welcome Back</h1>

        <p>
            Login to continue using PocketSmart AI.
        </p>

    </div>


    <div class="card">

        <h2>🔑 Login</h2>

        <form method="post" action="/login">

            <label>📧 Email:</label>

            <br>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>


            <label>🔐 Password:</label>

            <br>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <br><br>


            <button type="submit">
                🚀 Login
            </button>

        </form>

        <br>

        <p>
            Don't have an account?
            <p>
    <a href="/forgot-password">🔑 Forgot Password?</a>
</p>
            <a href="/register">Create an account</a>
        </p>

    </div>


    <div class="card">

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
